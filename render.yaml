services:
  - type: web
    name: legacy-sports
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install -g pnpm@10.26.1 && pnpm install --no-frozen-lockfile && BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/web run build && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: legacy-sports-db
          property: connectionString

databases:
  - name: legacy-sports-db
    plan: free
    databaseName: legacy_sports
    user: legacy_sports
