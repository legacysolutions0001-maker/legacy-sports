services:
  - type: web
    name: legacy-sports-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@10.26.1 --activate &&
      pnpm install &&
      pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false

  - type: web
    name: legacy-sports
    runtime: node
    region: singapore
    plan: free
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@10.26.1 --activate &&
      pnpm install &&
      VITE_API_BASE_URL=https://legacy-sports-api.onrender.com BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/web run build
    startCommand: npx serve -s artifacts/web/dist/public -l $PORT
    envVars:
      - key: BASE_PATH
        value: "/"
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: "https://legacy-sports-api.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
