openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Legacy Sports API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: schools
    description: School management
  - name: users
    description: User management
  - name: performances
    description: Performance tracking
  - name: attendance
    description: Attendance tracking
  - name: notifications
    description: Notifications
  - name: sports
    description: Sport configuration
  - name: analytics
    description: Analytics and reports
  - name: billing
    description: Pricing, subscriptions, and invoices

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/lookup-school:
    post:
      operationId: lookupSchool
      tags: [auth]
      summary: Look up school by code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolCodeInput"
      responses:
        "200":
          description: School found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolPublic"
        "404":
          description: School not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user session
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register player or coach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /schools:
    get:
      operationId: listSchools
      tags: [schools]
      summary: List all schools
      responses:
        "200":
          description: List of schools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/School"
    post:
      operationId: createSchool
      tags: [schools]
      summary: Create a school
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolInput"
      responses:
        "201":
          description: School created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"

  /schools/{id}:
    get:
      operationId: getSchool
      tags: [schools]
      summary: Get school by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: School
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"
    put:
      operationId: updateSchool
      tags: [schools]
      summary: Update school
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolInput"
      responses:
        "200":
          description: Updated school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"
    delete:
      operationId: deleteSchool
      tags: [schools]
      summary: Delete school
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /schools/{id}/pause:
    post:
      operationId: pauseSchool
      tags: [schools]
      summary: Pause or unpause a school
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolPauseInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: schoolId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
    put:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/{id}/status:
    patch:
      operationId: updateUserStatus
      tags: [users]
      summary: Approve / reject / suspend user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset a user's password (admin matrix-enforced)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/fitness:
    patch:
      operationId: updateFitness
      tags: [users]
      summary: Update player fitness status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FitnessUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /performances:
    get:
      operationId: listPerformances
      tags: [performances]
      summary: List performances
      parameters:
        - name: playerId
          in: query
          schema:
            type: integer
        - name: coachId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Performance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Performance"
    post:
      operationId: createPerformance
      tags: [performances]
      summary: Log a performance record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerformanceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Performance"

  /performances/{id}:
    delete:
      operationId: deletePerformance
      tags: [performances]
      summary: Delete performance record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: schoolId
          in: query
          schema:
            type: integer
        - name: coachId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
    post:
      operationId: markAttendance
      tags: [attendance]
      summary: Mark attendance for players
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceBatch"
      responses:
        "201":
          description: Attendance marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Get notifications for current user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    post:
      operationId: sendNotification
      tags: [notifications]
      summary: Send notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationInput"
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /sports:
    get:
      operationId: listSports
      tags: [sports]
      summary: List all sport configs
      responses:
        "200":
          description: Sports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SportConfig"
    post:
      operationId: upsertSport
      tags: [sports]
      summary: Create or update sport config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SportInput"
      responses:
        "200":
          description: Sport config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportConfig"

  /sports/{id}:
    delete:
      operationId: deleteSport
      tags: [sports]
      summary: Delete sport config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get platform analytics summary
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [analytics]
      summary: Get leaderboard data
      parameters:
        - name: schoolId
          in: query
          schema:
            type: integer
        - name: sport
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  # ── PRICING ────────────────────────────────────────────────────────────────
  /pricing:
    get:
      operationId: getPricing
      tags: [billing]
      summary: Get platform pricing configuration (superadmin)
      responses:
        "200":
          description: Pricing config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingConfig"
    put:
      operationId: updatePricing
      tags: [billing]
      summary: Update platform pricing configuration (superadmin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingConfigInput"
      responses:
        "200":
          description: Updated pricing config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingConfig"

  # ── SUBSCRIPTIONS ──────────────────────────────────────────────────────────
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [billing]
      summary: List subscriptions
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"

  /subscriptions/{schoolId}:
    patch:
      operationId: updateSubscription
      tags: [billing]
      summary: Update subscription settings for a school (superadmin)
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{schoolId}/preview:
    get:
      operationId: previewInvoice
      tags: [billing]
      summary: Preview the next invoice for a school
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePreview"

  /subscriptions/{schoolId}/invoice:
    post:
      operationId: generateInvoice
      tags: [billing]
      summary: Generate an invoice for a school
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Generated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  # ── INVOICES ───────────────────────────────────────────────────────────────
  /invoices:
    get:
      operationId: listInvoices
      tags: [billing]
      summary: List invoices
      parameters:
        - name: schoolId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    patch:
      operationId: updateInvoice
      tags: [billing]
      summary: Override invoice total, due date, or notes (superadmin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}/pay:
    post:
      operationId: markInvoicePaid
      tags: [billing]
      summary: Mark invoice as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}/unpay:
    post:
      operationId: markInvoiceUnpaid
      tags: [billing]
      summary: Reverse a payment (bounced/refunded)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}/void:
    post:
      operationId: voidInvoice
      tags: [billing]
      summary: Void an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Voided invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}/remind:
    post:
      operationId: sendInvoiceReminders
      tags: [billing]
      summary: Send AI payment reminders for an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channels:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Reminder logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReminderLog"

  # ── REMINDERS ──────────────────────────────────────────────────────────────
  /reminders:
    get:
      operationId: listReminders
      tags: [billing]
      summary: List reminder logs
      parameters:
        - name: invoiceId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of reminder logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReminderLog"

  # ── BILLING CYCLE ──────────────────────────────────────────────────────────
  /billing/run-cycle:
    post:
      operationId: runBillingCycle
      tags: [billing]
      summary: Run the monthly billing cycle (superadmin)
      responses:
        "200":
          description: Billing cycle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCycleResult"

  /billing/mark-overdue:
    post:
      operationId: markOverdueAndSuspend
      tags: [billing]
      summary: Mark overdue invoices and suspend delinquent schools (superadmin)
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  suspended:
                    type: integer

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    SchoolCodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    SchoolPublic:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        logoUrl:
          type: string
        primaryColor:
          type: string
        isPaused:
          type: boolean
        pauseMessage:
          type: string
      required: [id, name, code]

    School:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        phone:
          type: string
        whatsappNumber:
          type: string
        address:
          type: string
        email:
          type: string
        ownerName:
          type: string
        ownerPhone:
          type: string
        ownerWhatsapp:
          type: string
        ownerEmail:
          type: string
        principalName:
          type: string
        logoUrl:
          type: string
        primaryColor:
          type: string
        isPaused:
          type: boolean
        pauseMessage:
          type: string
        pausedAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, name, code]

    SchoolInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        code:
          type: string
        phone:
          type: string
        whatsappNumber:
          type: string
        address:
          type: string
        email:
          type: string
        ownerName:
          type: string
        ownerPhone:
          type: string
        ownerWhatsapp:
          type: string
        ownerEmail:
          type: string
        principalName:
          type: string
        primaryColor:
          type: string
        logoUrl:
          type: string

    SchoolPauseInput:
      type: object
      required: [paused]
      properties:
        paused:
          type: boolean
        message:
          type: string

    LoginInput:
      type: object
      required: [schoolCode, username, password]
      properties:
        schoolCode:
          type: string
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        school:
          $ref: "#/components/schemas/SchoolPublic"
      required: [user]

    SessionUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        role:
          type: string
        schoolId:
          type: ["integer", "null"]
        sport:
          type: string
        status:
          type: string
        isOwner:
          type: boolean
      required: [id, name, username, role]

    RegistrationInput:
      type: object
      required: [schoolCode, role, username, password, name, sport]
      properties:
        schoolCode:
          type: string
        role:
          type: string
          enum: [player, coach]
        username:
          type: string
